name: Build deploy branch

# Keeps the `deploy` branch (production vendor and assets included) in step with `main`.
# The hosting Git screen pulls that branch, so merging to main is all a release takes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and publish

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, intl, zip, gd, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Build deploy tree
        run: bash tools/build-deploy.sh "$RUNNER_TEMP/deploy"

      - name: Publish to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash tools/publish-deploy.sh "$RUNNER_TEMP/deploy" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
